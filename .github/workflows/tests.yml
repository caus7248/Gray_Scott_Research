name: Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m gray_scott --nx 16 --ny 12 --steps 10 --output outputs/smoke
      - run: python -m gray_scott --nx 16 --ny 13 --steps 20 --save-every 7 --spatial fourier --stepper rk45 --output outputs/fourier
